<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="magentaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.65; }
    }
    @keyframes eqBar1 {
      0%, 100% { height: 28px; y: 172px; }
      50% { height: 85px; y: 115px; }
    }
    @keyframes eqBar2 {
      0%, 100% { height: 65px; y: 135px; }
      50% { height: 110px; y: 90px; }
    }
    @keyframes eqBar3 {
      0%, 100% { height: 95px; y: 105px; }
      50% { height: 40px; y: 160px; }
    }
    @keyframes eqBar4 {
      0%, 100% { height: 45px; y: 155px; }
      50% { height: 100px; y: 100px; }
    }
    @keyframes eqBar5 {
      0%, 100% { height: 75px; y: 125px; }
      50% { height: 35px; y: 165px; }
    }
    @keyframes floatVinyl {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(180deg); }
    }
    .orb-cyan {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-magenta {
      animation: pulseOrb 10s ease-in-out infinite alternate;
      transform-origin: 1000px 250px;
    }
    .b1 { animation: eqBar1 1.2s ease-in-out infinite alternate; }
    .b2 { animation: eqBar2 0.9s ease-in-out infinite alternate; }
    .b3 { animation: eqBar3 1.5s ease-in-out infinite alternate; }
    .b4 { animation: eqBar4 1.1s ease-in-out infinite alternate; }
    .b5 { animation: eqBar5 1.4s ease-in-out infinite alternate; }
    .vinyl-spin {
      animation: floatVinyl 14s linear infinite;
      transform-origin: 1050px 180px;
    }
  </style>

  <!-- Background base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Glowing Background Orbs -->
  <circle cx="220" cy="110" r="160" fill="url(#cyanGlow)" filter="url(#glow)" class="orb-cyan" />
  <circle cx="1000" cy="240" r="180" fill="url(#magentaGlow)" filter="url(#glow)" class="orb-magenta" />

  <!-- Background Vinyl Record Accent -->
  <g class="vinyl-spin" opacity="0.22">
    <circle cx="1050" cy="180" r="115" fill="#090d16" stroke="#38bdf8" stroke-width="2" />
    <circle cx="1050" cy="180" r="90" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="1050" cy="180" r="65" fill="none" stroke="#64748b" stroke-width="1" />
    <circle cx="1050" cy="180" r="40" fill="#6366f1" />
    <circle cx="1050" cy="180" r="12" fill="#0f172a" />
  </g>

  <!-- Background Animated Equalizer Waves (Right side) -->
  <g opacity="0.45">
    <rect x="840" width="10" rx="5" fill="#38bdf8" class="b1" />
    <rect x="860" width="10" rx="5" fill="#818cf8" class="b2" />
    <rect x="880" width="10" rx="5" fill="#a855f7" class="b3" />
    <rect x="900" width="10" rx="5" fill="#ec4899" class="b4" />
    <rect x="920" width="10" rx="5" fill="#38bdf8" class="b5" />
  </g>

  <!-- Foreground Content: Pill Badge -->
  <g transform="translate(80, 52)">
    <rect width="310" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="16" r="6" fill="#10b981" />
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="0.5">AUDIOPHILE &amp; STREAMING ECOSYSTEM</text>
  </g>

  <!-- Foreground Title -->
  <text x="80" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="url(#titleGradient)" letter-spacing="-0.5">
    Awesome Music Streaming &amp; Audio Player
  </text>

  <!-- Foreground Subtitle -->
  <text x="80" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">
    Curated Hub for Cloud Music Platforms, Hi-Res Servers, Subsonic Clients &amp; Bit-Perfect Engines
  </text>

  <!-- Foreground Category Tags / Pills -->
  <g transform="translate(80, 240)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="145" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="16" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">⚡ Self-Hosted</text>

    <!-- Tag 2 -->
    <rect x="160" y="0" width="170" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="176" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#a855f7">🎵 Lossless FLAC / Hi-Res</text>

    <!-- Tag 3 -->
    <rect x="345" y="0" width="155" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="361" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ec4899">📡 Subsonic &amp; APIs</text>

    <!-- Tag 4 -->
    <rect x="515" y="0" width="165" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="531" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#34d399">🎧 Bit-Perfect DACs</text>
  </g>
</svg>
